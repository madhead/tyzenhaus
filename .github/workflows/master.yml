name: Master

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/checks.yml
    secrets: inherit
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write

  build-policies:
    name: Build policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-jvm
      - run: ./gradlew :policies:privacy
      - run: tar -cvf policies.tar policies/build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: policies
          path: |
            policies.tar

  build-mini-app:
    name: Build Mini App
    runs-on: ubuntu-latest
    needs:
      - build-policies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-mini-app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: policies
      - run: |
          tar xvf policies.tar
      - run: yarn run build
        working-directory: mini-app
      - run: tar -cvf mini-app.tar mini-app/build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mini-app
          path: |
            mini-app.tar

  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-jvm
      - run: ./gradlew clean :launcher:fly:installDist
      - run: tar -cvf backend.tar launcher/fly/build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend
          path: |
            backend.tar

  deploy-flyio:
    name: Fly.io deployment
    runs-on: ubuntu-latest
    needs:
      - build-mini-app
      - build-backend
      - tests
    permissions:
      contents: read
      packages: write
    environment:
      name: fly.io
      url: https://tyzenhaus.fly.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: madhead/read-java-properties@71bde77f1ee2be7e11438306dfbc89d1a019f64c
        id: project-version
        with:
          file: gradle.properties
          property: version
      - uses: madhead/semver-utils@092ff2bc46cae343afb90c5efbd606411fc45b49
        id: version
        with:
          version: ${{ steps.project-version.outputs.value }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mini-app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: backend
      - run: |
          tar xvf mini-app.tar
          tar xvf backend.tar
          mv mini-app/build launcher/fly/build/mini-app
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: launcher/fly
          push: true
          tags: >
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }},
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }},
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.major }},
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - run: >-
          flyctl deploy
          --app tyzenhaus
          --config launcher/fly/fly.toml
          --image ghcr.io/${{ github.repository }}:${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
